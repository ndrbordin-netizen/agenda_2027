<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agenda 2027 Bloom</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{
  --navy:#1b3259; --navy2:#243f6c; --cream:#f5f0e6; --ink:#1d1d1d; --muted:#6b6f78;
  --line:#dcd6ca; --card:#ffffff; --bg:#f5f0e6; --accent:#1b3259; --on-accent:#ffffff;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#eef0f4; --muted:#a6adbb; --line:#34405a; --card:#16223a; --bg:#0f1829;
    --accent:#f5f0e6; --on-accent:#1b3259;
  }
}
:root[data-theme="dark"]{
  --ink:#eef0f4; --muted:#a6adbb; --line:#34405a; --card:#16223a; --bg:#0f1829;
  --accent:#f5f0e6; --on-accent:#1b3259;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Poppins,system-ui,sans-serif;font-weight:400;line-height:1.5}
header{background:var(--navy);color:#fff;padding:28px 16px 34px}
.wrap{max-width:760px;margin:0 auto}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-family:Lora,serif;font-weight:700;font-size:15px;letter-spacing:.12em;text-transform:uppercase;color:var(--cream);opacity:.85}
.langs{display:flex;gap:6px}
.langs button{background:transparent;border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:999px;padding:4px 12px;font:500 13px Poppins,sans-serif;cursor:pointer}
.langs button.on{background:var(--cream);color:var(--navy);border-color:var(--cream)}
h1{font-family:Lora,serif;font-weight:700;font-size:clamp(30px,6vw,46px);line-height:1.1;margin:26px 0 8px}
header p{margin:0;color:var(--cream);font-weight:300;font-size:16px;max-width:560px}
main{padding:24px 16px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px 20px;margin-bottom:16px}
.step{display:flex;gap:12px;align-items:baseline;margin-bottom:14px}
.num{flex:none;width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-weight:600;font-size:14px}
h2{font-family:Lora,serif;font-weight:700;font-size:21px;margin:0}
.hint{color:var(--muted);font-size:14px;margin:-6px 0 14px 40px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.opt{position:relative;display:flex;gap:12px;align-items:flex-start;border:1.5px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--muted)}
.opt input{position:absolute;opacity:0;pointer-events:none}
.mark{flex:none;width:20px;height:20px;border:1.5px solid var(--muted);border-radius:50%;margin-top:2px;display:grid;place-items:center}
.opt.cb .mark{border-radius:5px}
.opt input:checked ~ .mark{background:var(--accent);border-color:var(--accent)}
.opt input:checked ~ .mark::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--on-accent)}
.opt.cb input:checked ~ .mark::after{width:10px;height:6px;border-radius:0;background:none;border-left:2px solid var(--on-accent);border-bottom:2px solid var(--on-accent);transform:rotate(-45deg) translate(1px,-1px)}
.opt:has(input:checked){border-color:var(--accent)}
.opt:not(.locked):has(input:disabled){opacity:.45;cursor:not-allowed}
.opt.locked{cursor:default}
.opt:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.opt b{display:block;font-weight:600;font-size:15px}
.opt small{display:block;color:var(--muted);font-size:13px;line-height:1.4;margin-top:2px}
.opt .fixed{position:absolute;top:10px;right:12px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.summary{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.summary .pages{color:var(--muted);font-size:14px}
.summary .pages strong{color:var(--ink);font-size:20px;font-weight:600;margin-right:4px}
.go{background:var(--accent);color:var(--on-accent);border:0;border-radius:999px;padding:14px 28px;font:600 16px Poppins,sans-serif;cursor:pointer;min-width:220px}
.go:disabled{opacity:.6;cursor:progress}
.status{margin:12px 0 0;font-size:14px;color:var(--muted);min-height:21px}
.help{font-size:14px;color:var(--muted)}
.help h3{font-family:Lora,serif;color:var(--ink);font-size:17px;margin:0 0 8px}
.help ul{margin:0;padding-left:18px}
.help li{margin:4px 0}
footer{text-align:center;color:var(--muted);font-size:12px;padding:0 16px 30px}
:root{--navy:#b9787a;--accent:#b9787a;--on-accent:#fff;--cream:#fdf0ee;--bg:#fbf6f1;--line:#ecd9d4;--ink:#5b4642;--muted:#9a7f78}
header{background:#c98b8b!important}
body{font-family:Nunito,system-ui,sans-serif}
h1,h2,.help h3{font-family:Playfair,Georgia,serif!important}
.brand{font-family:Dancing,cursive!important;text-transform:none!important;letter-spacing:0!important;font-size:24px!important;opacity:1!important}
.go,.langs button{font-family:Nunito,sans-serif!important;font-weight:700!important}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="top">
      <div class="brand" data-t="brand"></div>
      <div class="langs" role="group" aria-label="Language">
        <button data-lang="it">IT</button><button data-lang="en">EN</button><button data-lang="fr">FR</button><button data-lang="de">DE</button>
      </div>
    </div>
    <h1 data-t="h1"></h1>
    <p data-t="intro"></p>
  </div>
</header>

<main class="wrap">
  <section class="card">
    <div class="step"><span class="num">1</span><h2 data-t="q_hand"></h2></div>
    <p class="hint" data-t="q_hand_h"></p>
    <div class="opts">
      <label class="opt"><input type="radio" name="hand" value="right" checked><span class="mark"></span><span><b data-t="right"></b><small data-t="right_s"></small></span></label>
      <label class="opt"><input type="radio" name="hand" value="left"><span class="mark"></span><span><b data-t="left"></b><small data-t="left_s"></small></span></label>
    </div>
  </section>

  <section class="card">
    <div class="step"><span class="num">2</span><h2 data-t="q_start"></h2></div>
    <div class="opts">
      <label class="opt"><input type="radio" name="start" value="mon" checked><span class="mark"></span><span><b data-t="mon"></b></span></label>
      <label class="opt"><input type="radio" name="start" value="sun"><span class="mark"></span><span><b data-t="sun"></b></span></label>
    </div>
  </section>

  <section class="card">
    <div class="step"><span class="num">3</span><h2 data-t="q_sec"></h2></div>
    <p class="hint" data-t="q_sec_h"></p>
    <div class="opts">
      <label class="opt cb locked"><input type="checkbox" checked disabled><span class="mark"></span><span><b data-t="s_month"></b><small data-t="s_month_s"></small></span><span class="fixed" data-t="incl"></span></label>
      <label class="opt cb"><input type="checkbox" name="weekly" checked><span class="mark"></span><span><b data-t="s_week"></b><small data-t="s_week_s"></small></span></label>
      <label class="opt cb"><input type="checkbox" name="daily" checked><span class="mark"></span><span><b data-t="s_day"></b><small data-t="s_day_s"></small></span></label>
      <label class="opt cb"><input type="checkbox" name="dnotes"><span class="mark"></span><span><b data-t="s_dn"></b><small data-t="s_dn_s"></small></span></label>
    </div>
  </section>

  <section class="card">
    <div class="summary">
      <div class="pages"><strong id="pc">0</strong><span data-t="pages"></span></div>
      <button class="go" id="go" data-t="go"></button>
    </div>
    <p class="status" id="status" aria-live="polite"></p>
  </section>

  <section class="card help">
    <h3 data-t="how_t"></h3>
    <ul>
      <li data-t="how1"></li>
      <li data-t="how2"></li>
      <li data-t="how3"></li>
    </ul>
  </section>
</main>
<footer data-t="foot"></footer>

      const c=(m-1)%3, r=Math.floor((m-1)/3), x=x0+c*cw+(c?6:0), w=cw-12, yt=top+r*ch;
      const mc=T_.month(m);
      if(T_.tab==="color"){ doc.setFillColor(...tint(mc,0.25)); doc.roundedRect(x-4, yt+3, w+6, 18, 9, 9, "F"); }
      if(T_.header==="script"){ fS(17); col(T_.titleInk); doc.text(t.months[m-1], x, yt+17); }
      else { fT(12); col(T_.tab==="color"?T_.ink:T_.ink); doc.text(U(t.months[m-1]), x+(T_.tab==="color"?4:0), yt+16); }
      const dw=w/7; fBB(7.5); col(T_.muted);
      order.forEach((d,i)=>doc.text(t.d1[d], x+dw*i+dw/2, yt+34, {align:"center"}));
      let ws=weekStartOf(D(Y,m,1)), wi=0;
      const last=new Date(Date.UTC(Y,m,0)).getUTCDate();
      while(ws<=D(Y,m,last)){
        for(let i=0;i<7;i++){ const d=addDays(ws,i); if(d.getUTCMonth()!==m-1) continue;
          const cx=x+dw*i+dw/2, cy=yt+50+wi*17;
          if(wd(d)>=5){ doc.setFillColor(...(T_.tab==="color"?tint(mc,0.18):T_.fill)); doc.rect(cx-dw/2+1, cy-10.5, dw-2, 15, "F"); }
          fB(9.5); col(T_.ink); doc.text(String(d.getUTCDate()), cx, cy, {align:"center"});
          if(o.daily) link("d"+iso(d), cx-dw/2, cy-11, dw, 16);
        }
        ws=addDays(ws,7); wi++;
      }
      link("m"+m, x, yt+2, w, 20);
    }
    tabs("y"); }

  const todoPage=(scope, title, sub, tab)=>{
    page(); header(title, sub, scopeBtns(scope,"todo"));
    const gap=14, cw=(x1-x0-gap)/2, top=110, bot=H-40, rh=(bot-top-2*gap)/3;
    for(let r=0;r<3;r++) for(let k=0;k<2;k++){
      const x=x0+k*(cw+gap), yt=top+r*(rh+gap);
      const bc = T_.tab==="color"?acc():T_.box;
      doc.setDrawColor(...bc); doc.setLineWidth(1);
      if(T_.tab==="color"){ doc.setFillColor(...tint(bc,0.22)); box(x,yt,cw,22,"FD"); } else box(x,yt,cw,22,"S");
      doc.setDrawColor(...bc); if(T_.tab==="rect") doc.rect(x+5,yt+6,10,10); else doc.roundedRect(x+5,yt+6,10,10,2.5,2.5);
      let y=yt+46; doc.setLineWidth(0.6);
      while(y<yt+rh-6){ doc.setDrawColor(...T_.line); doc.line(x+20,y,x+cw,y);
        doc.setDrawColor(...(T_.tab==="color"?bc:T_.check)); if(T_.tab==="rect") doc.rect(x+4,y-11,9,9); else doc.roundedRect(x+4,y-11,9,9,2.5,2.5); y+=24; }
    }
    tabs(tab);
  };
  const notesPage=(scope,title,sub,tab)=>{ page(); header(title, sub, scopeBtns(scope,"notes")); lined(124, H-44, 26, x0, x1, true); tabs(tab); };
  todoPage("y", String(Y), t.t_todo, "y");
  notesPage("y", String(Y), t.t_notes, "y");

  /* ---------- mesi ---------- */
  for(let m=1;m<=12;m++){
    curM=m;
    const mk="m"+m, mn=t.months[m-1], mc=T_.month(m);
    page(); header(mn, String(Y), scopeBtns(mk,"cal"));
    const last=new Date(Date.UTC(Y,m,0)).getUTCDate();
    const mweeks=[]; for(let ws=weekStartOf(D(Y,m,1)); ws<=D(Y,m,last); ws=addDays(ws,7)) mweeks.push(ws);
    const wcol=22, gx0=x0+wcol, cw=(x1-gx0)/7, top=128, bot=H-40, rh=(bot-top)/mweeks.length;
    fBB(9);
    order.forEach((d,i)=>{ const lab=t.days[d].slice(0,3);
      if(T_.tab==="color"){ doc.setFillColor(...(wd(D(2027,1,4+d))>=5?tint(mc,0.55):mc)); doc.roundedRect(gx0+cw*i+3, top-24, cw-6, 18, 9, 9, "F"); col([255,255,255]); }
      else col(T_.header==="band"&&d>=5?T_.bandBg:T_.ink);
      doc.text(T_.upper||T_.tab==="color"?lab.toUpperCase():lab, gx0+cw*i+cw/2, top-11, {align:"center"}); });
    fBB(7); col(T_.muted); doc.text(t.wk, x0+wcol/2, top-11, {align:"center"});
    mweeks.forEach((ws,wi)=>{
      const yt=top+wi*rh;
      fB(8); col(T_.muted); doc.text(String(isoWeek(mondayOf(ws))), x0+wcol/2, yt+14, {align:"center"});
      if(o.weekly){ link("w"+weekIdx(ws), x0, yt+2, wcol, 20); }
      for(let i=0;i<7;i++){
        const d=addDays(ws,i), x=gx0+i*cw, inm=d.getUTCMonth()===m-1;
        if(inm && wd(d)>=5){ doc.setFillColor(...(T_.tab==="color"?tint(mc,0.16):T_.fill)); doc.rect(x,yt,cw,rh,"F"); }
        doc.setDrawColor(...(T_.gridCol||T_.box)); doc.setLineWidth(T_.gridW||0.7); doc.rect(x,yt,cw,rh);
        if(inm){
          if(T_.tab==="color"){ doc.setFillColor(...tint(mc,0.35)); doc.circle(x+13, yt+12, 9, "F"); fBB(10.5); col(T_.ink); doc.text(String(d.getUTCDate()), x+13, yt+15.6, {align:"center"}); }
          else if(T_.header==="band"){ fT(20); col(T_.ink); doc.text(two(d.getUTCDate()), x+5, yt+20); }
          else if(T_.header==="script"){ fT(14); col(T_.titleInk); doc.text(String(d.getUTCDate()), x+6, yt+17); }
          else { fBB(12); col(T_.ink); doc.text(two(d.getUTCDate()), x+5, yt+15); }
          if(o.daily) link("d"+iso(d), x+1, yt+1, 34, 22);
          else if(o.weekly) link("w"+weekIdx(d), x+1, yt+1, 34, 22);
        }
      }
    });
    tabs(mk);
    todoPage(mk, mn, `${t.t_todo} · ${Y}`, mk);
    notesPage(mk, mn, `${t.t_notes} · ${Y}`, mk);
  }

  /* ---------- settimane ---------- */
  const firstInYear = ws => { for(let i=0;i<7;i++){ const d=addDays(ws,i); if(d.getUTCFullYear()===Y) return d; } };
  if(o.weekly) weeks.forEach((ws,i)=>{
    const we=addDays(ws,6), fy=firstInYear(ws), m=fy.getUTCMonth()+1, mk="m"+m;
    curM=m;
    const rng=`${ws.getUTCDate()} ${t.months[ws.getUTCMonth()].slice(0,3)} - ${we.getUTCDate()} ${t.months[we.getUTCMonth()].slice(0,3)} ${Y}`;
    page();
    header(`${t.week} ${two(isoWeek(mondayOf(ws)))}`, rng, [
      {arrow:-1,key:i>0?"w"+(i-1):null},{label:t.bMonth,key:mk},{arrow:1,key:i<weeks.length-1?"w"+(i+1):null}]);
    const gap=12, cw=(x1-x0-gap)/2, top=110, bot=H-40, rh=(bot-top-3*gap)/4;
    for(let b=0;b<8;b++){
      const c=b<4?0:1, r=b%4, x=x0+c*(cw+gap), yt=top+r*(rh+gap);
      const a=acc();
      if(T_.tab==="color"){ doc.setFillColor(...tint(a,b===7?0.12:0.22)); doc.roundedRect(x,yt,cw,20,10,10,"F"); }
      else if(T_.header==="band"){ doc.setFillColor(...(b===7?T_.accentBar:T_.bandBg)); doc.rect(x,yt,cw,20,"F"); }
      else { doc.setDrawColor(...(T_.header==="script"?T_.ruleCol:T_.rule)); doc.setLineWidth(1); doc.line(x,yt+20,x+cw,yt+20); }
      const lc = T_.header==="band" ? (b===7?T_.bandBg:[255,255,255]) : T_.ink;
      const px = (T_.tab==="color"||T_.header==="band") ? 8 : 0;
      if(b<7){ const d=addDays(ws,b), iny=d.getUTCFullYear()===Y;
        fBB(11); col(iny?lc:T_.muted);
        const dn=t.days[wd(d)];
        if(T_.header==="script"){ fS(15); doc.text(dn, x+px, yt+15); } else doc.text(T_.upper||T_.tab==="color"?dn.toUpperCase():dn, x+px, yt+14);
        fBB(11); doc.text(two(d.getUTCDate()), x+cw-px, yt+14, {align:"right"});
        if(iny && o.daily) link("d"+iso(d), x, yt, cw, 20);
      } else { col(lc);
        if(T_.header==="script"){ fS(15); doc.text(t.dnotes, x+px, yt+15); }
        else { fBB(11); doc.text(t.dnotes.toUpperCase(), x+px, yt+14); } }
      lined(yt+42, yt+rh-4, 22, x, x+cw);
    }
    tabs(mk);
  });

  /* ---------- giorni ---------- */
  if(o.daily) days.forEach((d,i)=>{
    const k=iso(d), m=d.getUTCMonth()+1, mk="m"+m, dn=t.days[wd(d)];
    curM=m;
    const sub=`${t.months[d.getUTCMonth()]} ${Y} · ${t.week} ${isoWeek(d)} · ${t.doy.replace("{n}",doyOf(d))}`;
    const prev=i>0?"d"+iso(days[i-1]):null, next=i<days.length-1?"d"+iso(days[i+1]):null;
    const btns=[{arrow:-1,key:prev}];
    if(o.weekly) btns.push({label:t.bWeek,key:"w"+weekIdx(d)});
    btns.push({label:t.bMonth,key:mk});
    if(o.dnotes) btns.push({label:t.notes,key:"n"+k});
    btns.push({arrow:1,key:next});
    page(); header(`${dn} ${two(d.getUTCDate())}`, sub, btns, {nodeco:true});
    sec(t.prio, 122); checks(x0, x1, 148, 3);
    sec(t.tasks, 226);
    const half=(x1-x0-20)/2;
    checks(x0, x0+half, 252, 7); checks(x0+half+20, x1, 252, 7);
    sec(t.dnotes, 444); lined(470, H-44);
    tabs(mk);
    if(o.dnotes){
      page(); header(`${dn} ${two(d.getUTCDate())}`, `${t.notes} · ${t.months[d.getUTCMonth()]} ${Y}`,
        [{label:t.bDay,key:"d"+k},{label:t.notes,key:"n"+k,on:true}], {nodeco:true});
      lined(124, H-44, 26, x0, x1, true); tabs(mk);
    }
  });

  const parts=["M"]; if(o.weekly) parts.push("W"); if(o.daily) parts.push("D"); if(o.dnotes) parts.push("N");
  const fname=`${t.file}${T_.name?"_"+T_.name:""}_${o.lang.toUpperCase()}_${t.hand[o.hand]}_${t.start[o.start]}_${parts.join("")}.pdf`;
  return {doc, fname, pages:keys.length};
}

/* ======================= UI ======================= */
let lang = (new URLSearchParams(location.search).get("lang") || (navigator.language||"it").slice(0,2)).toLowerCase();
if(!UI[lang]) lang = "en";
const $ = s => document.querySelector(s);
function opts(){
  const f = n => document.querySelector(`input[name=${n}]`);
  return {lang, hand:document.querySelector("input[name=hand]:checked").value,
    start:document.querySelector("input[name=start]:checked").value,
    weekly:f("weekly").checked, daily:f("daily").checked, dnotes:f("daily").checked && f("dnotes").checked};
}
function refresh(){
  const dn=document.querySelector("input[name=dnotes]"), daily=document.querySelector("input[name=daily]");
  dn.disabled=!daily.checked; if(!daily.checked) dn.checked=false;
  $("#pc").textContent = buildPlanner({...opts(), countOnly:true});
}
function applyLang(){
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-t]").forEach(el=>el.textContent = UI[lang][el.dataset.t]);
  document.querySelectorAll(".langs button").forEach(b=>b.classList.toggle("on", b.dataset.lang===lang));
  document.title = UI[lang].h1 + " · Bloom"; document.querySelector(".brand").textContent = UI[lang].brand + " · Bloom";
  $("#status").textContent = "";
}
document.querySelectorAll(".langs button").forEach(b=>b.onclick=()=>{ lang=b.dataset.lang; applyLang();
  try{ const u=new URL(location.href); u.searchParams.set("lang",lang); history.replaceState(null,"",u); }catch(e){} });
document.querySelectorAll("input").forEach(i=>i.addEventListener("change", refresh));
$("#go").onclick = () => {
  const btn=$("#go"), st=$("#status"); btn.disabled=true; st.textContent=UI[lang].busy;
  setTimeout(()=>{
    try{ const {doc,fname}=buildPlanner(opts()); doc.save(fname); st.textContent=UI[lang].done.replace("{f}",fname); }
    catch(e){ console.error(e); st.textContent=UI[lang].err; }
    btn.disabled=false;
  }, 60);
};
applyLang(); refresh();
</script>
